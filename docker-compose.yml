services:
  # Backend API Service
  backend_multiple:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_multiple
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_HOST=${REDIS_HOST:-host.docker.internal}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_ENABLED=${REDIS_ENABLED:-false}
      - REDIS_DEFAULT_TTL=${REDIS_DEFAULT_TTL:-2000}
      - CLICKHOUSE_URL=${CLICKHOUSE_URL}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.5'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Frontend UI Service
  frontend_multiple:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_multiple
    ports:
      - "9500:9500"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1400M
          cpus: '1'
        reservations:
          memory: 512M
