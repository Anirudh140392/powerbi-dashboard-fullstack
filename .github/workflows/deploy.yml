name: Deploy to EC2

on:
  push:
    branches:
      - enhancement_01122025_backend_kenil
  workflow_dispatch:  # Allow manual trigger

env:
  APP_DIR: /Dashboard/powerbi-dashboard-fullstack

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Create .env file on EC2
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            # Ensure the user has permissions to the directory
            sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} ${{ env.APP_DIR }}
            
            cd ${{ env.APP_DIR }}
            cat > .env << 'EOF'
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          REDIS_HOST=host.docker.internal
          REDIS_PORT=6379
          REDIS_PASSWORD=
          REDIS_DB=${{ secrets.REDIS_DB }}
          REDIS_ENABLED=${{ secrets.REDIS_ENABLED }}
          REDIS_DEFAULT_TTL=${{ secrets.REDIS_DEFAULT_TTL }}
          CLICKHOUSE_URL=${{ secrets.CLICKHOUSE_URL }}
          CLICKHOUSE_USER=${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD=${{ secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_DB=${{ secrets.CLICKHOUSE_DB }}
          ENABLE_DEBUG_LOGS=true
          EOF
            echo "✅ .env file created"
          ENDSSH

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            
            echo "📁 Navigating to app directory..."
            cd ${{ env.APP_DIR }} || { echo "❌ App directory not found"; exit 1; }
            
            # Resolve dubious ownership error
            git config --global --add safe.directory ${{ env.APP_DIR }}
            
            echo "📥 Pulling latest code from branch: ${{ github.ref_name }}..."
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            echo "🛑 Stopping and removing specific containers..."
            sudo docker stop backend frontend || true
            sudo docker rm backend frontend || true
            
            echo "🔨 Building and starting containers..."
            sudo docker compose build --no-cache
            sudo docker compose up -d
            
            echo "⏳ Waiting for services to start..."
            sleep 10
            
            echo "🔍 Checking container status..."
            sudo docker compose ps
            
            echo "✅ Health check..."
            curl -sf http://localhost/health || { echo "❌ Health check failed"; exit 1; }
            
            echo "🎉 Deployment successful!"
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key


      - name: Deployment Summary
        run: |
          echo "## Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployed to: \`${{ secrets.EC2_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "📦 Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "🔗 App: http://${{ secrets.EC2_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "🔗 API: http://${{ secrets.EC2_HOST }}/api" >> $GITHUB_STEP_SUMMARY

